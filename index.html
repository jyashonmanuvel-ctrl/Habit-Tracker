<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Quest — Colorful Habit Tracker Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap" id="appWrap">

  <!-- Header -->
  <header class="topbar">
    <div class="brand">
      <span class="sparkle">✨</span>
      <h1>Habit Quest Dashboard</h1>
    </div>
    <div class="topbar-actions">
      <button id="exportBtn" class="icon-btn" title="Export data">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button id="importBtn" class="icon-btn" title="Import data">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </button>
      <input type="file" id="importFile" accept=".json" hidden>
      <div class="streak-pill">
        <span class="flame">🔥</span>
        <span id="streakText">0 day streak</span>
      </div>
    </div>
  </header>

  <!-- Dashboard grid -->

  <div class="dq-grid">

    <!-- Control Panel -->
    <section class="dq-card" style="grid-area:control">
      <p class="dq-title">Control Panel</p>
      <label class="dq-label">Year</label>
      <select id="yearSelect" class="dq-select"></select>
      <label class="dq-label">Month</label>
      <select id="monthSelect" class="dq-select"></select>
    </section>

    <!-- Daily Progress -->
    <section class="dq-card" style="grid-area:daily">
      <p class="dq-title" id="dailyTitle">Daily Progress</p>
      <div class="chart-box" style="height:118px"><canvas id="dailyChart"></canvas></div>
    </section>

    <!-- Weekly Progress -->
    <section class="dq-card" style="grid-area:weekly">
      <p class="dq-title">Weekly Progress</p>
      <div class="chart-box" style="height:118px"><canvas id="weeklyChart"></canvas></div>
    </section>

    <!-- Overall Stats -->
    <section class="dq-card" style="grid-area:stats">
      <p class="dq-title">Overall Stats</p>
      <div class="stats-row">
        <div class="stat"><p class="stat-num" id="goalNum">0</p><p class="stat-lbl">Goal</p></div>
        <div class="stat"><p class="stat-num" id="doneNum" style="color:#6BCB77">0</p><p class="stat-lbl">Done</p></div>
        <div class="stat"><p class="stat-num" id="leftNum" style="color:#FF6B6B">0</p><p class="stat-lbl">Left</p></div>
      </div>
      <div class="ring-wrap">
        <div class="chart-box" style="width:80px;height:80px"><canvas id="overallChart"></canvas></div>
        <p class="ring-pct" id="overallPct">0%</p>
      </div>
    </section>

    <!-- My Habits -->
    <section class="dq-card" style="grid-area:habits">
      <div class="row-between">
        <p class="dq-title" style="margin:0">My Habits</p>
        <button id="addHabitBtn" class="pill-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add habit
        </button>
      </div>
      <div id="addHabitForm" class="add-form hidden">
        <input id="newHabitInput" type="text" placeholder="New habit name" maxlength="40">
        <button id="confirmAddHabit">Add</button>
      </div>
      <div class="table-scroll">
        <table id="habitTable">
          <thead><tr id="habitTableHead"></tr></thead>
          <tbody id="habitTableBody"></tbody>
        </table>
      </div>
    </section>

    <!-- Analysis -->
    <section class="dq-card" style="grid-area:analysis">
      <p class="dq-title">Analysis</p>
      <div id="analysisList" class="analysis-list"></div>
    </section>

    <!-- Days strip -->
    <section class="dq-card" style="grid-area:daystrip">
      <p class="dq-title" id="daysTitle">Days</p>
      <div id="dayStrip" class="day-strip"></div>
      <div class="day-legend">
        <span><i class="legend-dot" style="background:#6BCB77"></i>Completed</span>
        <span><i class="legend-dot" style="background:#FFD93D"></i>Partial</span>
        <span><i class="legend-dot" style="background:rgba(255,255,255,0.08)"></i>Pending</span>
        <span><i class="legend-dot legend-today"></i>Today</span>
      </div>
    </section>

    <!-- Tasks for selected day -->
    <section class="dq-card" style="grid-area:taskpanel">
      <div class="row-between">
        <p class="dq-title" id="taskPanelTitle" style="margin:0">Tasks</p>
        <button id="addTaskBtn" class="pill-btn hidden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Task
        </button>
      </div>
      <div id="addTaskForm" class="add-form hidden">
        <input id="newTaskInput" type="text" placeholder="New task name" maxlength="40">
        <button id="confirmAddTask">Add</button>
      </div>
      <div id="taskEmptyState" class="task-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="46" height="46"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><circle cx="16" cy="16" r="3"/><path d="M16 15v1.5l1 .5"/></svg>
        <p class="task-empty-title">Select a day</p>
        <p class="task-empty-sub">Choose a date above to view your daily tasks</p>
      </div>
      <div id="taskListWrap" class="hidden">
        <div id="taskList" class="task-list"></div>
        <div class="task-footer">
          <span id="taskCountLabel" class="task-count">0 of 0 tasks completed</span>
        </div>
      </div>
    </section>

  </div>

  <p id="statusMsg" class="status-msg"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
